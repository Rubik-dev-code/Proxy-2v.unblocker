<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R+ Proxy Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Fixed Background Configuration */
        body {
            background-image: url('fire.jpg'); /* This looks for your uploaded fire.jpg file */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }

        /* Centered Search Engine Box Design */
        .search-container {
            background: rgba(20, 20, 20, 0.85);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ff4500;
            box-shadow: 0 8px 32px 0 rgba(255, 69, 0, 0.3);
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .engine-title {
            font-size: 56px;
            font-weight: bold;
            color: #ff4500;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.7);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }
        
        input { 
            flex: 1; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            font-size: 16px;
            outline: none;
        }
        
        input:focus {
            border-color: #ff4500;
            box-shadow: 0 0 8px rgba(255, 69, 0, 0.6);
        }

        button { 
            padding: 15px 25px; 
            border: none; 
            background: #ff4500; 
            color: white; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.2s ease;
        }

        button:hover { 
            background: #cc3700; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="engine-title">R+</div>
        
        <!-- Redirects smoothly to CroxyProxy public home interface -->
        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="search with R+" autocomplete="off">
            <button onclick="launchProxy()">Search</button>
        </div>
    </div>

    <script>
        function launchProxy() {
            const inputField = document.getElementById('urlInput');
            let query = inputField.value.trim();
            
            if (!query) return alert('Please enter a website URL or a search query.');

            // Format plaintext phrases into Google Search syntax
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (!query.includes('.') || query.includes(' ')) {
                    query = 'https://google.com' + encodeURIComponent(query);
                } else {
                    query = 'https://' + query;
                }
            }

            // Encodes the target to pass directly to CroxyProxy's open browser view
            window.location.href = 'https://croxyproxy.com' + encodeURIComponent(query);
        }

        // Listens for the Enter key to submit the search
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                launchProxy();
            }
        });
    </script>

</body>
</html>
