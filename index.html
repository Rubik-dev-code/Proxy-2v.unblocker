<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R+ Proxy Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-image: url('fire.jpg'); /* Your custom R+ background image file */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }

        .search-container {
            background: rgba(20, 20, 20, 0.85);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ff4500;
            box-shadow: 0 8px 32px 0 rgba(255, 69, 0, 0.3);
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .engine-title {
            font-size: 56px;
            font-weight: bold;
            color: #ff4500;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.7);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }
        
        input { 
            flex: 1; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            font-size: 16px;
            outline: none;
        }

        button { 
            padding: 15px 25px; 
            border: none; 
            background: #ff4500; 
            color: white; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="engine-title">R+</div>
        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="search with R+" autocomplete="off">
            <button onclick="launchProxy()">Search</button>
        </div>
    </div>

    <script>
        function launchProxy() {
            const input = document.getElementById('urlInput').value.trim();
            if (!input) return alert('Please enter a query.');

            let url = input;
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.') && !input.includes(' ')) {
                    url = 'https://' + input;
                } else {
                    url = 'https://google.com' + encodeURIComponent(input);
                }
            }

            // Routes through an open-network proxy gateway node that allows hotlinking
            window.location.href = 'https://allorigins.win' + encodeURIComponent(url);
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') launchProxy();
        });
    </script>

</body>
</html>
