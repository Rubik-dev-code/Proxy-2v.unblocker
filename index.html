<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R+ Proxy Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        /* Background fire image styling */
        body {
            background-image: url('https://unsplash.com'); /* Replace this link with your own R+ fire image URL */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .nav-bar { 
            display: flex; 
            gap: 10px; 
            padding: 10px; 
            background: rgba(26, 26, 26, 0.85); /* Slightly transparent to see background */
            align-items: center; 
            height: 60px; 
            border-bottom: 2px solid #333; 
            backdrop-filter: blur(5px);
        }
        
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; }
        button { padding: 10px 20px; border: none; background: #ff4500; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #cc3700; }
        
        .frame-container { height: calc(100% - 60px); width: 100%; background: transparent; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <strong style="color:#ff4500;">Engine:</strong>
        <!-- Placeholder text updated to 'search with R+' -->
        <input type="text" id="urlInput" placeholder="search with R+">
        <button onclick="launchProxy()">Browse Securely</button>
    </div>

    <div class="frame-container">
        <iframe id="proxyViewer" src="about:blank"></iframe>
    </div>

    <script>
        function launchProxy() {
            const input = document.getElementById('urlInput').value.trim();
            const viewer = document.getElementById('proxyViewer');
            
            if (!input) return alert('Please enter a target web destination or search term.');

            let targetUrl = input;
            
            // Check if input is a valid URL, otherwise format it as a Google search query
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.') && !input.includes(' ')) {
                    targetUrl = 'https://' + input;
                } else {
                    // This turns raw text input into an actual search link
                    targetUrl = 'https://google.com' + encodeURIComponent(input);
                }
            }

            // Fixed the live form submission endpoint for CroxyProxy's service
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'https://croxyproxy.com';
            form.target = 'proxyViewer'; // Force the results to load inside our iframe

            const inputField = document.createElement('input');
            inputField.type = 'hidden';
            inputField.name = 'url';
            inputField.value = targetUrl;

            form.appendChild(inputField);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        // Listens for the Enter key to trigger the search successfully
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                launchProxy();
            }
        });
    </script>

</body>
</html>
