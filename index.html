<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R+ Proxy Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Your Custom Fire Background */
        body {
            background-image: url('fire.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            background-color: #121212;
        }

        /* Top Nav Search Bar Layout */
        .nav-bar { 
            display: flex; 
            gap: 10px; 
            padding: 10px; 
            background: rgba(20, 20, 20, 0.85); 
            align-items: center; 
            height: 70px; 
            border-bottom: 2px solid #ff4500; 
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .engine-title {
            font-size: 32px;
            font-weight: bold;
            color: #ff4500;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
            padding-right: 15px;
        }

        .input-wrapper {
            display: flex;
            flex: 1;
            gap: 10px;
        }
        
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            font-size: 16px;
            outline: none;
        }
        
        input:focus {
            border-color: #ff4500;
            box-shadow: 0 0 8px rgba(255, 69, 0, 0.6);
        }

        button { 
            padding: 12px 25px; 
            border: none; 
            background: #ff4500; 
            color: white; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
        }

        button:hover { 
            background: #cc3700; 
        }

        /* Full Screen Window to Display the Unblocked Sites */
        .frame-container { 
            flex: 1;
            width: 100%; 
            background: rgba(0,0,0,0.4); 
        }
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="engine-title">R+</div>
        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="search with R+" autocomplete="off">
            <button onclick="launchProxy()">Search</button>
        </div>
    </div>

    <div class="frame-container">
        <iframe id="proxyViewer" src="about:blank"></iframe>
    </div>

    <script>
        function launchProxy() {
            const input = document.getElementById('urlInput').value.trim();
            const viewer = document.getElementById('proxyViewer');
            if (!input) return alert('Please enter a website link or search term.');

            let targetUrl = input;
            
            // Format input text to a standard URL string structure
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.') && !input.includes(' ')) {
                    targetUrl = 'https://' + input;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(input);
                }
            }

            // Clean public proxy gateway logic that allows open cross-domain connections 
            const openGateway = 'https://allorigins.win';
            
            // Re-render target data through fetch injection directly inside your layout iframe
            fetch(openGateway + encodeURIComponent(targetUrl))
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Network proxy error');
                })
                .then(data => {
                    // Injects target unblocked website directly into your iframe source safely
                    const doc = viewer.contentWindow.document;
                    doc.open();
                    doc.write(data.contents);
                    doc.close();
                })
                .catch(err => {
                    // Fallback redirect method if secure site prevents data-injection blocks
                    viewer.src = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(targetUrl);
                });
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') launchProxy();
        });
    </script>

</body>
</html>
